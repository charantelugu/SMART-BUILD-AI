# SMART BUILD AI - Spring Boot Backend Configuration
server.port=8080

# Default DataSource: H2 in-memory database with MySQL syntax compatibility for immediate zero-friction startup
spring.datasource.url=jdbc:h2:mem:smartbuild;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# SQL Init (creates tables from schema.sql & inserts seed data from data.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Gemini AI API Key (Set via environment variable GEMINI_API_KEY or override below)
gemini.api.key=${GEMINI_API_KEY:}
